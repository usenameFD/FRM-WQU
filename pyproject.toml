[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oilbn"
version = "0.1.0"
description = "Bayesian-network and regime-switching toolkit for crude oil price risk analysis (MScFE 660 mini-capstone, GWP1-3)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Student 1" },
    { name = "Student 2" },
    { name = "Student 3" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "networkx>=3.2",
    "pgmpy>=0.1.25",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fredapi>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
